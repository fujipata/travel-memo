<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行支出メモ</title>

  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
      color: #252f3d;
      background: #f2f7fb;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 540px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      padding-bottom: max(40px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 8px 0 24px;
      font-size: clamp(25px, 6vw, 30px);
      line-height: 1.3;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    h2 {
      margin: 24px 4px 10px;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 650;
    }

    .input-card, section[aria-label="オフライン利用"],
    section[aria-labelledby="data-heading"], #total, ul {
      background: #fff;
      border: 1px solid #e3ebf2;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgb(35 63 88 / 4%);
    }

    .input-card, section[aria-label="オフライン利用"],
    section[aria-labelledby="data-heading"] {
      padding: 20px;
      margin: 0 0 20px;
    }

    p {
      margin: 0 0 12px;
      color: #586778;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    p:last-child { margin-bottom: 0; }
    p:empty { margin: 0; }
    #offline-status { color: #354b60; font-weight: 600; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-card > label:first-child { margin-top: 0; }

    input, select, button {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      margin: 0 0 8px;
      padding: 11px 12px;
      border: 1px solid #d5e0eb;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
    }

    input, select { color: #252f3d; background: #f8fafc; }
    input::placeholder { color: #6b7785; opacity: 1; }
    #amount { font-variant-numeric: tabular-nums; }

    button {
      color: #fff;
      background: #0873d1;
      border-color: transparent;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .input-card > button { margin: 14px 0 0; }
    button:active { filter: brightness(0.9); }
    button:disabled { opacity: 0.5; cursor: default; }
    :is(input, select, button):focus-visible {
      outline: 3px solid #0873d1;
      outline-offset: 3px;
    }

    #check-update, section[aria-labelledby="data-heading"] button {
      color: #0965b5;
      background: #edf5ff;
      border-color: #dceafd;
    }

    #total {
      padding: 20px;
      margin: 24px 0;
      font-size: 26px;
      line-height: 1.4;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    ul { list-style: none; padding: 0; margin: 0 0 24px; }
    li {
      padding: 16px;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }
    li + li { border-top: 1px solid #e8eef4; }
    #list:empty { border: 0; box-shadow: none; }

    #list > .day-group { padding: 0; }
    .day-group summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      cursor: pointer;
      list-style: none;
      font-weight: 600;
    }
    .day-group summary::-webkit-details-marker { display: none; }
    .day-group summary::after { content: "▶"; font-size: 12px; }
    .day-group details[open] > summary::after { content: "▼"; }
    .day-group summary:focus-visible { outline: 3px solid #0873d1; outline-offset: -3px; }
    .day-total { margin-left: auto; text-align: right; }
    .day-records { margin: 0; border: 0; border-radius: 0; box-shadow: none; }
    .day-records > li:first-child { border-top: 1px solid #e8eef4; }

    .delete-button {
      display: block;
      width: auto;
      min-height: 44px;
      margin: 10px 0 0 auto;
      padding: 9px 16px;
      font-size: 14px;
      color: #b42332;
      background: #fff1f2;
      border-color: #f5dce0;
    }

    section[aria-labelledby="data-heading"] h2 { margin: 0 0 16px; }
    #restore-file { font-size: 16px; padding: 8px; }
    #restore-file::file-selector-button {
      min-height: 44px;
      margin-right: 8px;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: #e7eff8;
      color: #24547e;
      font: inherit;
    }
    #restore-preview {
      padding: 14px;
      margin: 16px 0;
      border: 1px solid #dce6f0;
      border-radius: 12px;
      background: #f2f7fb;
    }

    @media (max-width: 360px) {
      body { padding-right: 14px; padding-left: 14px; }
      .input-card, section[aria-label="オフライン利用"],
      section[aria-labelledby="data-heading"] { padding: 16px; }
    }
  </style>
  <script src="./offline.js" defer></script>
</head>

<body>

  <h1>旅行　支出メモ</h1>
  <section aria-label="オフライン利用">
    <p id="offline-status" role="status">オフライン利用の準備を確認しています。</p>
    <p id="connection-status"></p>
    <button id="check-update" type="button">アプリの更新を確認</button>
    <button id="apply-update" type="button" hidden>新しい版へ更新する</button>
    <p id="update-status" role="status"></p>
  </section>

  <div class="input-card">
  <label>大分類</label>
  <select id="category">
    <option>食事</option>
    <option>交通</option>
    <option>宿泊</option>
    <option>お土産</option>
    <option>登山</option>
    <option>観光・参拝</option>
    <option>その他</option>
  </select>

  <label for="subcategory">小分類</label>
  <select id="subcategory"></select>

  <label>金額</label>
  <input type="number" id="amount" placeholder="例：1200">

  <label>メモ</label>
  <input type="text" id="memo" placeholder="例：昼食">

  <label for="expense-date">日付</label>
  <input type="date" id="expense-date" required>

  <label for="expense-time">時刻</label>
  <input type="time" id="expense-time" required>

  <button onclick="addExpense()">記録する</button>
  </div>

  <div id="total">合計：0円</div>

  <section aria-labelledby="daily-heading">
    <h2 id="daily-heading">日別合計</h2>
    <ul id="daily-totals"></ul>
  </section>

  <section aria-labelledby="category-heading">
    <h2 id="category-heading">分類別合計</h2>
    <ul id="category-totals"></ul>
  </section>

  <h2>記録</h2>
  <ul id="list"></ul>

  <section aria-labelledby="data-heading">
    <h2 id="data-heading">記録の保存・復元</h2>
    <button type="button" onclick="exportRecords('csv')">CSVを書き出す（集計用）</button>
    <button type="button" onclick="exportRecords('backup')">バックアップを保存する</button>
    <p>iPhoneでは共有画面の「ファイルに保存」を選んでください。CSVは表計算用、バックアップはこのアプリへの復元用です。</p>
    <p>ファイルには支出とメモが含まれます。保存できたことを「ファイル」アプリで確認してください。</p>
    <label for="restore-file">バックアップから復元（JSONファイル）</label>
    <input id="restore-file" type="file" accept=".json,application/json">
    <p>復元は現在の記録を置き換えます。先に今の記録もバックアップしてください。CSVからの復元には対応していません。</p>
    <div id="restore-preview" hidden>
      <p id="restore-summary"></p>
      <button type="button" onclick="applyRestore()">この内容で置き換える</button>
      <button type="button" onclick="cancelRestore()">キャンセル</button>
    </div>
    <button id="undo-restore" type="button" onclick="undoRestore()" hidden>復元前の記録に戻す</button>
    <p id="data-status" role="status" aria-live="polite"></p>
  </section>

  <script>
  // 保存済みの記録を読み込む
  let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

  const subcategories = {
    "食事": ["外食", "コンビニ"],
    "交通": ["ガソリン", "高速料金", "駐車場", "公共交通"],
    "宿泊": ["ホテル", "日帰り温泉"],
    "登山": ["登山バッジ", "入山料"],
    "観光・参拝": ["拝観料", "御朱印", "その他"]
  };

  function updateSubcategories() {
    const choices = subcategories[document.getElementById("category").value] || [];
    const select = document.getElementById("subcategory");
    select.innerHTML = "";
    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = choices.length ? "選択しない" : "小分類なし";
    select.appendChild(empty);
    choices.forEach(label => {
      const option = document.createElement("option");
      option.value = label;
      option.textContent = label;
      select.appendChild(option);
    });
    select.value = "";
    select.disabled = choices.length === 0;
  }

  document.getElementById("category").addEventListener("change", updateSubcategories);
  updateSubcategories();

  function localDate(date) {
    return date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0") + "-" +
      String(date.getDate()).padStart(2, "0");
  }

  let customDateTime = false;
  function resetDateTime() {
    const now = new Date();
    document.getElementById("expense-date").value = localDate(now);
    document.getElementById("expense-time").value =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    customDateTime = false;
  }
  ["expense-date", "expense-time"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => { customDateTime = true; });
  });
  resetDateTime();

  const dayOpenStates = new Map();

  function addExpense() {
    const category = document.getElementById("category").value;
    const subcategory = document.getElementById("subcategory").value;
    const amount = Number(document.getElementById("amount").value);
    const memo = document.getElementById("memo").value;

    if (!Number.isFinite(amount) || amount <= 0) {
      alert("金額を入力してください");
      return;
    }

    // 日時を変更していない場合は、登録時点の現在日時を使う。
    if (!customDateTime) resetDateTime();
    const dateInput = document.getElementById("expense-date");
    const timeInput = document.getElementById("expense-time");
    const date = dateInput.value;
    const now = new Date(date + "T" + timeInput.value);
    if (!date || !timeInput.value || !Number.isFinite(now.getTime()) ||
        localDate(now) !== date) {
      alert("日付と時刻を入力してください");
      return;
    }

    // 新しい支出を記録に追加
    const next = [...expenses, {
      category: category,
      ...((subcategories[category] || []).includes(subcategory) ? {subcategory} : {}),
      amount: amount,
      memo: memo,
      date: date,
      dateTime: now.toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      })
    }];

    if (!saveExpenses(next)) return;

    // 入力欄を空にする
    document.getElementById("amount").value = "";
    document.getElementById("memo").value = "";
    resetDateTime();
  }

  // 旧データには年がないため、今年の記録と推測して混ぜない
  function getExpenseDay(expense) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(expense.date || "")) {
      return expense.date;
    }
    const match = /^(\d{1,2})\/(\d{1,2})(?:\s|$)/.exec(expense.dateTime || "");
    return match
      ? "年不明：" + match[1].padStart(2, "0") + "/" + match[2].padStart(2, "0")
      : "日付不明";
  }

  function displaySummary(id, totals) {
    const list = document.getElementById(id);
    list.innerHTML = "";
    if (totals.size === 0) {
      const item = document.createElement("li");
      item.textContent = "まだ記録がありません";
      list.appendChild(item);
      return;
    }
    totals.forEach(function(amount, label) {
      const item = document.createElement("li");
      item.textContent = label + "：" + amount.toLocaleString("ja-JP") + "円";
      list.appendChild(item);
    });
  }

  function displayExpenses() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    let total = 0;
    const dailyTotals = new Map();
    const categoryTotals = new Map();
    const dayRecords = new Map();

    expenses.forEach(function(expense, index) {
      total = total + expense.amount;
      const day = getExpenseDay(expense);
      dailyTotals.set(day, (dailyTotals.get(day) || 0) + expense.amount);
      categoryTotals.set(expense.category,
        (categoryTotals.get(expense.category) || 0) + expense.amount);

      const item = document.createElement("li");

      item.textContent =
        (expense.dateTime ? expense.dateTime + "　" : "") +
        expense.category + (expense.subcategory ? " / " + expense.subcategory : "") + "　" +
        expense.amount.toLocaleString() + "円　" +
        expense.memo;
const deleteButton = document.createElement("button");
deleteButton.textContent = "削除";
deleteButton.className = "delete-button";

deleteButton.onclick = function() {
  saveExpenses(expenses.filter((_, itemIndex) => itemIndex !== index));
};

item.appendChild(deleteButton);

      if (!dayRecords.has(day)) dayRecords.set(day, []);
      dayRecords.get(day).push(item);
    });

    [...dayRecords].sort(([a], [b]) => b.localeCompare(a, "ja")).forEach(([day, items]) => {
      const group = document.createElement("li");
      group.className = "day-group";
      const details = document.createElement("details");
      details.open = dayOpenStates.has(day) ? dayOpenStates.get(day) : day === localDate(new Date());
      details.addEventListener("toggle", () => { dayOpenStates.set(day, details.open); });
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      label.textContent = /^\d{4}-\d{2}-\d{2}$/.test(day)
        ? new Date(day + "T00:00:00").toLocaleDateString("ja-JP", {
          year: "numeric", month: "numeric", day: "numeric", weekday: "short"
        }) : day;
      const amount = document.createElement("span");
      amount.className = "day-total";
      amount.textContent = "合計 " + dailyTotals.get(day).toLocaleString("ja-JP") + "円";
      summary.appendChild(label);
      summary.appendChild(amount);
      details.appendChild(summary);
      const records = document.createElement("ul");
      records.className = "day-records";
      items.forEach(item => records.appendChild(item));
      details.appendChild(records);
      group.appendChild(details);
      list.appendChild(group);
    });

    document.getElementById("total").textContent =
      "合計：" + total.toLocaleString() + "円";
    displaySummary("daily-totals", new Map(
      [...dailyTotals].sort(([a], [b]) => a.localeCompare(b, "ja"))
    ));
    displaySummary("category-totals", categoryTotals);
  }

  const BACKUP_APP = "travel-memo";
  const RECOVERY_KEY = "expenses-before-restore";
  let pendingRestore = null;
  let restoreReadId = 0;

  function setDataStatus(message) {
    document.getElementById("data-status").textContent = message;
  }

  function saveExpenses(next) {
    try {
      localStorage.setItem("expenses", JSON.stringify(next));
    } catch (error) {
      alert("保存できませんでした。空き容量やブラウザーの設定を確認してください。記録は変更していません。");
      return false;
    }
    expenses = next;
    displayExpenses();
    return true;
  }

  function fileStamp() {
    const now = new Date();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") +
      "-" + String(now.getDate()).padStart(2, "0") + "-" +
      String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0");
  }

  // メモなどを表計算ソフトの数式として実行させない
  function csvCell(value, protectFormula = true) {
    let text = String(value == null ? "" : value);
    if (protectFormula && /^[\s\uFEFF]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function makeCsv(records) {
    const rows = [["日付", "記録日時（元の表示）", "大分類", "小分類", "金額（円）", "メモ"].map(v => csvCell(v)).join(",")];
    records.forEach(expense => rows.push([
      csvCell(getExpenseDay(expense)), csvCell(expense.dateTime),
      csvCell(expense.category), csvCell(expense.subcategory), csvCell(expense.amount, false), csvCell(expense.memo)
    ].join(",")));
    return "\uFEFF" + rows.join("\r\n") + "\r\n";
  }

  function makeBackup(records) {
    return JSON.stringify({app: BACKUP_APP, version: 1, exportedAt: new Date().toISOString(), expenses: records}, null, 2);
  }

  async function exportRecords(kind) {
    const isCsv = kind === "csv";
    const file = new File([isCsv ? makeCsv(expenses) : makeBackup(expenses)],
      "travel-memo-" + fileStamp() + (isCsv ? ".csv" : ".json"),
      {type: isCsv ? "text/csv;charset=utf-8" : "application/json"});
    try {
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file]});
        setDataStatus("共有画面を閉じました。「ファイル」アプリなどで保存先を確認してください。");
      } else {
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        setDataStatus("書き出しを開始しました。ダウンロード先にファイルがあることを確認してください。");
      }
    } catch (error) {
      setDataStatus(error.name === "AbortError" ? "書き出しをキャンセルしました。記録は変更していません。" :
        "書き出しができませんでした。もう一度お試しください。");
    }
  }

  function parseBackup(text) {
    const data = JSON.parse(text);
    if (!data || data.app !== BACKUP_APP || data.version !== 1 ||
        !Array.isArray(data.expenses) || data.expenses.length > 10000) {
      throw new Error("このアプリのバックアップではありません。");
    }
    return data.expenses.map(item => {
      if (!item || typeof item !== "object" ||
          typeof item.category !== "string" || !item.category.trim() || item.category.length > 100 ||
          typeof item.amount !== "number" || !Number.isFinite(item.amount) || item.amount <= 0 ||
          item.amount > Number.MAX_SAFE_INTEGER ||
          typeof item.memo !== "string" || item.memo.length > 100000 ||
          (item.dateTime !== undefined && (typeof item.dateTime !== "string" || item.dateTime.length > 100))) {
        throw new Error("記録の形式が正しくありません。");
      }
      const clean = {category: item.category, amount: item.amount, memo: item.memo};
      if (item.subcategory !== undefined) {
        if (typeof item.subcategory !== "string" || item.subcategory.length > 100) {
          throw new Error("小分類の形式が正しくありません。");
        }
        clean.subcategory = item.subcategory;
      }
      if (item.date !== undefined) {
        if (typeof item.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(item.date)) throw new Error("日付が正しくありません。");
        const date = new Date(item.date + "T00:00:00Z");
        if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== item.date) throw new Error("日付が正しくありません。");
        clean.date = item.date;
      }
      if (item.dateTime !== undefined) clean.dateTime = item.dateTime;
      return clean;
    });
  }

  function cancelRestore() {
    restoreReadId++;
    pendingRestore = null;
    document.getElementById("restore-file").value = "";
    document.getElementById("restore-preview").hidden = true;
  }

  async function previewRestore(event) {
    const file = event.target.files[0];
    const readId = ++restoreReadId;
    pendingRestore = null;
    document.getElementById("restore-preview").hidden = true;
    if (!file) return;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error("ファイルは5MB以下にしてください。");
      const text = await file.text();
      if (readId !== restoreReadId) return;
      const records = parseBackup(text);
      pendingRestore = records;
      const total = records.reduce((sum, item) => sum + item.amount, 0);
      if (!Number.isFinite(total) || total > Number.MAX_SAFE_INTEGER) throw new Error("合計金額が大きすぎます。");
      document.getElementById("restore-summary").textContent =
        records.length + "件・合計" + total.toLocaleString("ja-JP") + "円の記録で、現在の記録をすべて置き換えます。追加ではありません。";
      document.getElementById("restore-preview").hidden = false;
      setDataStatus("内容を確認し、復元する場合は「この内容で置き換える」を押してください。");
    } catch (error) {
      if (readId !== restoreReadId) return;
      pendingRestore = null;
      document.getElementById("restore-file").value = "";
      setDataStatus("読み込めませんでした。このアプリで保存したバックアップ（JSON）を選んでください。記録は変更していません。");
    }
  }

  function applyRestore() {
    if (pendingRestore === null) return;
    if (!confirm("現在の" + expenses.length + "件を、バックアップの" + pendingRestore.length + "件に置き換えますか？")) return;
    try {
      // 現在の記録を保存できない場合は、置き換えを行わない
      localStorage.setItem(RECOVERY_KEY, makeBackup(expenses));
    } catch (error) {
      setDataStatus("復元前の記録を保存できないため、置き換えを中止しました。");
      return;
    }
    document.getElementById("undo-restore").hidden = false;
    if (!saveExpenses(pendingRestore)) return;
    cancelRestore();
    setDataStatus("復元しました。直前の記録へ戻すボタンも利用できます。");
  }

  function undoRestore() {
    try {
      const records = parseBackup(localStorage.getItem(RECOVERY_KEY));
      if (!confirm("現在の記録を、復元する直前の" + records.length + "件に戻しますか？復元後に追加した記録も置き換わります。")) return;
      if (!saveExpenses(records)) return;
      cancelRestore();
      setDataStatus("復元する直前の記録に戻しました。");
    } catch (error) {
      setDataStatus("復元前の記録を読み込めませんでした。現在の記録は変更していません。");
    }
  }

  document.getElementById("restore-file").addEventListener("change", previewRestore);
  try {
    document.getElementById("undo-restore").hidden = !localStorage.getItem(RECOVERY_KEY);
  } catch (error) {
    setDataStatus("ブラウザーの保存領域を利用できません。");
  }

  // アプリを開いたときに保存済みデータを表示
  displayExpenses();
</script>

</body>
</html>
